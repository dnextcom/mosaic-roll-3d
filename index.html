<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a28">
  <meta name="description" content="Juega a Mosaic Roll 3D. Combina dados de cerámica y compra azulejos de poder para completar tres mosaicos.">
  <title>Mosaic Roll 3D</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
  <script type="module" src="juego.js"></script>
</head>
<body>
  <main class="start" id="start">
    <div class="start-frame">
      <div class="start-content">
        <span class="eyebrow"><i class="diamond"></i> Juego de dados</span>
        <h1>Mosaic<br><em>Roll 3D</em></h1>
        <p>Combina dados de cerámica y mejora tu bolsa en el taller.</p>
        <div class="start-actions">
          <button class="button primary" type="button" id="play" disabled>Cargando partida… <span aria-hidden="true">→</span></button>
          <button class="button" type="button" id="new" hidden>Nueva partida</button>
          <button class="button" type="button" data-help>Cómo jugar</button>
        </div>
        <p class="boot" id="boot" role="status" hidden></p>
        <a class="download" href="Mosaic-Roll-3D.zip?v=taller-2" download>Descargar edición Windows</a>
      </div>
    </div>
  </main>

  <main class="game" id="game" hidden>
    <header class="game-header">
      <button class="button quiet pause-button" type="button" id="pause" aria-label="Pausa"><span aria-hidden="true">‹</span> Pausa</button>
      <div class="stage"><span class="eyebrow" id="stage-label"></span><h1 id="stage-name"></h1></div>
      <ol class="journey" id="journey" aria-label="Mosaicos"></ol>
      <button class="button quiet sound-button" type="button" id="sound" aria-label="Sonido" aria-pressed="true"><span aria-hidden="true">♪</span><span>Sonido</span></button>
    </header>
    <div class="mobile-stats" aria-live="polite" id="mobile-stats"></div>
    <div class="layout">
      <section class="play-area" aria-label="Mesa 3D">
        <div class="world" id="world">
          <canvas id="canvas" tabindex="0" aria-label="Tablero de dados 3D" aria-describedby="hint"></canvas>
          <div class="world-labels" id="world-labels" aria-hidden="true"></div>
          <output class="flash" id="flash" hidden></output>
        </div>
        <div class="table-controls">
          <p id="hint" aria-live="polite"></p>
          <button class="button quiet" type="button" id="top">Vista cenital</button>
          <button class="button quiet" type="button" id="reset-camera">Centrar</button>
        </div>
        <p class="key-tip">Botón derecho para girar · Rueda para acercar · 1–4 para elegir · Espacio para puntuar</p>
        <div class="mobile-actions">
          <button class="button" type="button" id="mobile-chisel">Cincel</button>
          <button class="button primary" type="button" id="mobile-confirm" disabled>Puntuar <strong id="mobile-points">+0</strong></button>
        </div>
      </section>
      <aside class="hud" aria-label="Puntuación y combinaciones">
        <section class="tally">
          <h2 class="eyebrow">Puntuación</h2>
          <div class="tally-value"><strong id="score">0</strong><span id="goal"></span></div>
          <progress id="progress" value="0" aria-label="Objetivo del mosaico"></progress>
          <div class="turns-and-chisel">
            <div><span class="eyebrow">Turnos</span><div class="turns" id="turns"></div></div>
            <button class="button" type="button" id="chisel" aria-pressed="false">Cincel</button>
          </div>
        </section>
        <section class="patterns">
          <h2>Combinaciones</h2>
          <ul id="patterns"></ul>
        </section>
        <section class="play-total" aria-live="polite">
          <div><h2 class="eyebrow">Jugada actual</h2><strong id="preview">+0</strong></div>
          <p id="breakdown"></p>
          <p class="placement" id="placed"></p>
        </section>
        <button class="button primary confirm" id="confirm" type="button" disabled>Puntuar jugada <span aria-hidden="true">→</span></button>
        <div class="inventory"><p id="inventory"></p><p id="active-powers"></p></div>
      </aside>
    </div>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>Activa JavaScript en el navegador para jugar a Mosaic Roll 3D.</noscript>
</body>
</html>
