name: Deploy Mosaic Roll 3D to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar archivos del juego
        run: |
          mkdir -p _site
          cp -r .nojekyll index.html estilo.css juego.js mesa.js reglas.js catalogo.js arte.js mercado.js taller.js unicos.js coleccion.js idioma.js ingles.js frances.js iconos.js musica.js portada.jpg mesa.jpg azulejo.jpg partida.webp Mosaic-Roll-3D.zip vendor v1 v2 v3 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
