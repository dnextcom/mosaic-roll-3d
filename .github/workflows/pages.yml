name: "Deploy Bescuit: Dau i Forn to GitHub Pages"

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar archivos del juego
        run: |
          mkdir -p _site
          cp -r .nojekyll index.html estilo.css juego.js mesa.js reglas.js catalogo.js arte.js mercado.js taller.js unicos.js coleccion.js idioma.js valenciano.js ingles.js frances.js iconos.js musica.js musica-umbria.mp3 portada.jpg mesa.jpg azulejo.jpg partida.webp Mosaic-Roll-3D.zip vendor v1 v2 v3 _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Limpiar artifacts antiguos de GitHub Pages
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            for (const artifact of artifacts) {
              if (artifact.name === 'github-pages' && artifact.workflow_run?.id !== context.runId) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                } catch (err) {
                  core.info(`No se pudo borrar artifact ${artifact.id}: ${err.message}`);
                }
              }
            }
